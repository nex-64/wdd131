<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Nathan Murray">
    <meta name="description" content="Recipes for your kitchen!">     
    <!-- Open Graph (Facebook, LinkedIn, etc.) -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Recipe Book">
    <meta property="og:description" content="Recipes for your kitchen!">
    <meta property="og:url" content="https://nex-64.github.io/wdd131/recipes/">
    <meta property="og:image" content="https://nex-64.github.io/wdd131/recipes/images/og-image.png">
    <!-- X Card -->
    <meta name="twitter:card" content="Social Preview Image">
    <meta name="twitter:title" content="Recipe Book">
    <meta name="twitter:description" content="Recipes for your kitchen!">
    <meta name="twitter:image" content="https://nex-64.github.io/wdd131/recipes/images/og-image.png">
    <!-- One favicon (ICO works everywhere) -->
    <link rel="icon" href="favicon.ico">
    <!-- One Apple Touch Icon (iOS home screen) -->
    <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
    <title>Recipe Book</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <img src="images/recipe-book.png" alt="Recipe Book Logo">
        <h1>RecipeBook</h1>
    </header>
    <main>
        <form id="search">
            <input type="text" placeholder="Find a recipe" id="searchbar" required>
            <button type="button">
                <img src="images/search.svg" alt="Search button">
            </button>
        </form>
        <hr>
        <section class="recipe-list">
            <article class="recipe">
                <img src="images/apple-crisp.jpg" alt="Apple Crisp">
                <div class="recipe-details">
                    <span class="tags">
                        <p>dessert</p>
                    </span>
                    <h2>Apple Crisp</h2>
                    <span
                    class="rating"
                    role="img"
                    aria-label="Rating: 4 out of 5 stars">
                        <span aria-hidden="true" class="icon-star">⭐</span>
                        <span aria-hidden="true" class="icon-star">⭐</span>
                        <span aria-hidden="true" class="icon-star">⭐</span>
                        <span aria-hidden="true" class="icon-star">⭐</span>
                        <span aria-hidden="true" class="icon-star-empty">☆</span>
                    </span>
                    <p class="desktop">
                        This apple crisp recipe is a simple yet delicious fall dessert 
                        that's great served warm with vanilla ice cream.
                    </p>
                </div>
            </article>
        </section>
    </main>
    <footer>
        <a href="https://www.flaticon.com/free-icons/recipe" title="recipe icons">
            Recipe icons created by Freepik - Flaticon
        </a>                   
        <div class="social">
            <!-- Social media icons provided under CC from https://www.iconfinder.com/AlfredoCreates -->
            <a href="#"><img src="images/instagram_icon.svg" alt="instagram icon"></a>
            <a href="#"><img src="images/youtube_icon.svg" alt="youtube icon"></a>
            <a href="#"><img src="images/pinterest_icon.svg" alt="pinterest icon"></a>
        </div>                                 
    </footer>
</body>
</html>
