<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credit Card Form</title>
    <link rel="stylesheet" href="styles.css">
    <script defer src="creditcard.js"></script>
</head>
<body>
    <header></header>
    <main>
        <section class="errors"></section>
        <form id="checkoutForm">
            <div id="cardFront">
                <p>TOTAL: $199</p>
                <p id="creditCard" role="img" aria-label="Credit Card Symbol">💳</p>
                <div id="cardNumber">
                    <label for="creditCardNumber">CARD NUMBER</label>
                    <input 
                    type="text" 
                    id="creditCardNumber" 
                    name="creditCardNumber" 
                    placeholder="0123 4567 8910 1020" 
                    pattern="[0-9]{16}"
                    required>
                </div>
                <div id="cardHolder">
                    <label for="creditCardHolder">CARD HOLDER</label>
                    <input 
                    type="text" 
                    id="creditCardHolder" 
                    name="creditCardHolder" 
                    placeholder="John Doe">
                </div>
                <div id="cardExpiration">
                    <label for="expirationDate">EXPIRATION</label>
                    <input 
                    type='text' 
                    id='month' 
                    name="expMonth" 
                    placeholder="MM" 
                    aria-labelledby="expirationDate"
                    required>
                    <input 
                    type='text' 
                    id='year' 
                    name="expYear" 
                    placeholder="YY" 
                    aria-labelledby="expirationDate"
                    required>
                </div>
            </div>
            <div id="cardBack">
                <div id="cardStripe"></div>
                <div id="cardCVC">
                    <label for="creditCardCVC">CVC/CVV</label>
                    <input type='text' id='creditCardCVC' name="CVC" placeholder="xxx">
                </div>
            </div>
            <button id="submit" type="submit">Submit</button>
        </form>
    </main>
    <footer></footer>
</body>
</html>
